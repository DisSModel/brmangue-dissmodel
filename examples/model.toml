# examples/coastal_model.toml

[model.parameters]
end_time      = 20
sea_level_rise_rate = 0.5
tide_height         = 6.0
accretion_enabled   = false
resolution    = 100.0
crs           = "EPSG:31984"
bands         = ["uso"]

# Interactive mode — set to true for local CLI with display
interactive   = false