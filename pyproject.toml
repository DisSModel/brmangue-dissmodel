[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brmangue-dissmodel"
version = "0.1.0"
description = "Implementation of the Bezerra et al. (2014) mangrove migration and coastal flood models on top of DisSModel."
readme = "README.md"
authors = [{ name = "Sergio Souza Costa", email = "sergio@ufma.br" }]
license = { text = "MIT" }
dependencies = [
    "dissmodel>=0.4.0",
    "numpy>=1.23.0",
    "geopandas>=0.12.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "matplotlib>=3.5.0",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/lambdageo/coastal-dynamics"
Documentation = "https://lambdageo.github.io/coastal-dynamics"

[tool.setuptools.packages.find]
where = ["."]
include = ["brmangue*"]
