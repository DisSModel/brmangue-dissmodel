[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brmangue-dissmodel"
version = "0.3.0"
description = "Implementation of the Bezerra et al. (2014) mangrove migration and coastal flood models on top of DisSModel."
readme = "README.md"
authors = [{ name = "Sergio Souza Costa", email = "sergio@ufma.br" }]
license = { text = "MIT" }
dependencies = [
    "dissmodel>=0.4.0",
    "numpy>=1.23.0",
    "geopandas>=0.12.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "matplotlib>=3.5.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/DisSModel/brmangue-dissmodel"

